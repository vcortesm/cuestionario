    {base:"sleep", ing:"sleeping", pp:"slept", past:"slept"},
    {base:"talk", ing:"talking", pp:"talked", past:"talked"},
    {base:"watch", ing:"watching", pp:"watched", past:"watched"},
    {base:"listen", ing:"listening", pp:"listened", past:"listened"}
  ];
  const times = ["for two hours","for three days","for a week","for a month","for ten years","since 2015","since Monday","since last year","since childhood","since 8 AM","all day","all morning"];

  let idx = 0;
  let attempts = 0;
  while (QUESTION_BANK.length < 300 && attempts < 2000) {
    attempts++;
    const subj = subjects[idx % subjects.length];
    const verb = verbs[(idx + 3) % verbs.length];
    const time = times[(idx * 2 + 1) % times.length];
    const hasOrHave = subj.has === "has" ? "has" : "have";

    if (idx % 4 === 0) {
      // MC: Present Perfect
      const correct = `${subj.s} ${hasOrHave} ${verb.pp} ${time}.`;
      const distractors = [
        `${subj.s} ${verb.past} ${time}.`,
        `${subj.s} ${subj.be} ${verb.ing} ${time}.`,
        `${subj.s} ${hasOrHave} been ${verb.ing} ${time}.`
      ];
      const opts = shuffleArr([correct, ...distractors.slice(0,3)]);
      QUESTION_BANK.push({
        type:"mc",
        q:`${subj.s} ______ ${verb.base} ${time}. (Present Perfect)`,
        opts: opts,
        ans: opts.indexOf(correct)
      });
    } else if (idx % 4 === 1) {
      // MC: Present Perfect Continuous
      const correct = `${subj.s} ${hasOrHave} been ${verb.ing} ${time}.`;
      const distractors = [
        `${subj.s} ${verb.past} ${time}.`,
        `${subj.s} ${hasOrHave} ${verb.pp} ${time}.`,
        `${subj.s} ${subj.be} ${verb.ing} ${time}.`
      ];
      const opts = shuffleArr([correct, ...distractors.slice(0,3)]);
      QUESTION_BANK.push({
        type:"mc",
        q:`${subj.s} ______ ${verb.base} ${time}. (Present Perfect Continuous)`,
        opts: opts,
        ans: opts.indexOf(correct)
      });
    } else if (idx % 4 === 2) {
      // MC: just/yet/already
      const variant = idx % 3;
      if (variant === 0) {
        const correct = `${subj.s} ${hasOrHave} just ${verb.pp}.`;
        const distractors = [
          `${subj.s} ${verb.past} just.`,
          `${subj.s} ${hasOrHave} been ${verb.ing}.`,
          `${subj.s} ${subj.be} ${verb.ing}.`
        ];
        const opts = shuffleArr([correct, ...distractors]);
        QUESTION_BANK.push({
          type:"mc",
          q:`${subj.s} ______ just ______ (${verb.base}). (Present Perfect)`,
          opts: opts,
          ans: opts.indexOf(correct)
        });
      } else if (variant === 1) {
        const correct = `${subj.s} ${hasOrHave} already ${verb.pp}.`;
        const distractors = [
          `${subj.s} ${verb.past} already.`,
          `${subj.s} ${hasOrHave} been ${verb.ing}.`,
          `${subj.s} ${subj.be} ${verb.ing}.`
        ];
        const opts = shuffleArr([correct, ...distractors]);
        QUESTION_BANK.push({
          type:"mc",
          q:`${subj.s} ______ already ______ (${verb.base}). (Present Perfect)`,
          opts: opts,
          ans: opts.indexOf(correct)
        });
      } else {
        const correct = `${subj.s} ${hasOrHave === "has" ? "hasn't" : "haven't"} ${verb.pp} yet.`;
        const distractors = [
          `${subj.s} ${verb.past} yet.`,
          `${subj.s} ${hasOrHave} been ${verb.ing} yet.`,
          `${subj.s} ${subj.be} not ${verb.ing} yet.`
        ];
        const opts = shuffleArr([correct, ...distractors]);
        QUESTION_BANK.push({
          type:"mc",
          q:`${subj.s} ______ (not) ______ (${verb.base}) yet. (Present Perfect)`,
          opts: opts,
          ans: opts.indexOf(correct)
        });
      }
    } else {
      // TF just/yet/already
      const statements = [
        {q:`'${subj.s} ${hasOrHave} just ${verb.pp}' es correcta.`, ans:true},
        {q:`'${subj.s} ${hasOrHave} already ${verb.pp}' es correcta.`, ans:true},
        {q:`'${subj.s} ${verb.past} yet' es correcta en Present Perfect.`, ans:false},
        {q:`'${subj.s} ${hasOrHave} ${verb.pp} yet' es correcta en afirmativa.`, ans:false},
        {q:`'Yet' se usa principalmente en negativas e interrogativas.`, ans:true},
        {q:`'Already' se usa en afirmativas e interrogativas.`, ans:true},
        {q:`'Just' significa 'acabar de' en Present Perfect.`, ans:true}
      ];
      const st = statements[idx % statements.length];
      QUESTION_BANK.push({type:"tf", q: st.q, ans: st.ans});
    }
    idx++;
  }
})();

// ============================================================
// UTILIDADES
// ============================================================
function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getFailedQuestions() {
  try {
    const raw = localStorage.getItem('grammarQuizFailed');
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}

function saveFailedQuestions(arr) {
  try { localStorage.setItem('grammarQuizFailed', JSON.stringify(arr)); } catch(e) {}
}

function addFailedQuestion(q) {
  const failed = getFailedQuestions();
  // Evitar duplicados comparando texto de pregunta
  if (!failed.some(f => f.q === q.q)) {
    failed.push(q);
    saveFailedQuestions(failed);
  }
}

function removeFailedQuestion(q) {
  let failed = getFailedQuestions();
  failed = failed.filter(f => f.q !== q.q);
  saveFailedQuestions(failed);
}

function clearFailed() {
  if (confirm('¿Seguro que quieres borrar el historial de preguntas falladas?')) {
    localStorage.removeItem('grammarQuizFailed');
    updateFailedCount();
    alert('Historial borrado.');
  }
}

function updateFailedCount() {
  const count = getFailedQuestions().length;
  document.getElementById('failedCount').textContent = count;
  const btn = document.getElementById('reviewBtn');
  if (count > 0) btn.disabled = false;
  else btn.disabled = true;
}

// ============================================================
// SELECCIÓN Y RENDERIZADO
// ============================================================
const QUESTIONS_PER_QUIZ = 50;
let selectedQuestions = [];
let answeredCount = 0;
let score = 0;
let isReviewMode = false;

function selectRandomQuestions() {
  const shuffled = shuffleArr(QUESTION_BANK);
  selectedQuestions = shuffled.slice(0, QUESTIONS_PER_QUIZ);
}

function startReviewMode() {
  const failed = getFailedQuestions();
  if (failed.length === 0) { alert('No hay preguntas falladas para repasar.'); return; }
  selectedQuestions = shuffleArr(failed).slice(0, Math.min(50, failed.length));
  isReviewMode = true;
  answeredCount = 0;
  score = 0;
  document.getElementById('questionsContainer').innerHTML = '';
  document.getElementById('scoreBox').style.display = 'none';
  document.getElementById('progress').style.width = '0%';
  document.getElementById('modeBadge').textContent = `🔁 Modo repaso: ${selectedQuestions.length} preguntas falladas`;
  document.getElementById('progressText').textContent = `0 / ${selectedQuestions.length} respondidas`;
  renderQuestions();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function renderQuestions() {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';
  selectedQuestions.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'question-card' + (isReviewMode ? ' review' : '');
    card.dataset.index = i;
    card.dataset.answered = 'false';

    let labelText = '';
    if (q.type === 'mc') labelText = 'Opción múltiple';
    else if (q.type === 'fill') labelText = 'Completar oración';
    else if (q.type === 'tf') labelText = 'Falso o Verdadero';
    else if (q.type === 'audio') labelText = '🎧 Audio';

    let html = `<span class="question-label">${labelText}</span>`;
    html += `<p class="question-text">${i + 1}. ${q.q}</p>`;

    if (q.type === 'audio') {
      const safeAudio = q.audio.replace(/'/g, "\\'").replace(/"/g, '&quot;');
      html += `<button class="audio-btn" onclick="playAudioText('${safeAudio}', this)">🔊 Reproducir audio</button>`;
    }

    if (q.type === 'fill') {
      html += `<input type="text" class="fill-input" placeholder="Escribe tu respuesta..." data-idx="${i}">`;
    } else {
      const opts = q.type === 'tf'
        ? [{text:'Verdadero', val:'true'}, {text:'Falso', val:'false'}]
        : q.opts.map((o, idx) => ({text:o, val:idx}));
      const shuffledOpts = shuffleArr(opts);

      html += '<div class="options">';
      shuffledOpts.forEach((o) => {
        html += `<label class="option">
          <input type="radio" name="q${i}" value="${o.val}">
          <span>${o.text}</span>
        </label>`;
      });
      html += '</div>';
    }

    html += `<button class="check-btn" onclick="checkAnswer(${i}, this)">Comprobar</button>`;
    html += `<div class="feedback"></div>`;

    card.innerHTML = html;
    container.appendChild(card);
  });
}

// ============================================================
// AUDIO
// ============================================================
function playAudioText(text, btn) {
  btn.classList.add('playing');
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'en-US';
  utt.rate = 0.85;
  utt.onend = () => btn.classList.remove('playing');
  speechSynthesis.cancel();
  speechSynthesis.speak(utt);
}

// ============================================================
// VERIFICACIÓN
// ============================================================
function checkAnswer(idx, btn) {
  const q = selectedQuestions[idx];
  const card = btn.closest('.question-card');
  const feedback = card.querySelector('.feedback');

  if (card.dataset.answered === 'true') return;

  let isCorrect = false;
  let userAnswer = '';

  if (q.type === 'fill') {
    const input = card.querySelector('.fill-input');
    userAnswer = input.value.trim().toLowerCase().replace(/\.$/, '').replace(/\s+/g, ' ');
    const validAnswers = q.ans.map(a => a.toLowerCase().replace(/\.$/, '').replace(/\s+/g, ' '));
    isCorrect = validAnswers.includes(userAnswer);
    input.disabled = true;
    input.classList.add(isCorrect ? 'correct' : 'incorrect');
  } else {
    const selected = card.querySelector('input[type=radio]:checked');
    if (!selected) { alert('Selecciona una opción'); return; }

    if (q.type === 'tf') {
      isCorrect = (selected.value === 'true') === q.ans;
    } else {
      isCorrect = parseInt(selected.value) === q.ans;
    }

    card.querySelectorAll('.option').forEach(opt => {
      const input = opt.querySelector('input');
      input.disabled = true;
      const val = q.type === 'tf' ? input.value : parseInt(input.value);
      if (q.type === 'tf') {
        if ((val === 'true') === q.ans) opt.classList.add('correct');
        else if (input.checked) opt.classList.add('incorrect');
      } else {
        if (val === q.ans) opt.classList.add('correct');
        else if (input.checked) opt.classList.add('incorrect');
      }
      opt.style.cursor = 'default';
    });
  }

  // Guardar / eliminar de falladas
  if (isCorrect) {
    score++;
    feedback.className = 'feedback show correct';
    feedback.textContent = '✅ ¡Correcto!';
    if (isReviewMode) removeFailedQuestion(q);
  } else {
    feedback.className = 'feedback show incorrect';
    let correctText = '';
    if (q.type === 'fill') correctText = q.ans[0];
    else if (q.type === 'tf') correctText = q.ans ? 'Verdadero' : 'Falso';
    else correctText = q.opts[q.ans];
    feedback.textContent = `❌ Incorrecto. Respuesta correcta: "${correctText}"`;
    if (!isReviewMode) addFailedQuestion(q);
  }

  btn.disabled = true;
  card.dataset.answered = 'true';
  answeredCount++;
  updateProgress();
}

function updateProgress() {
  const total = selectedQuestions.length;
  const pct = (answeredCount / total) * 100;
  document.getElementById('progress').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${answeredCount} / ${total} respondidas · Aciertos: ${score}`;

  if (answeredCount === total) {
    setTimeout(() => {
      document.getElementById('finalScore').textContent = `${score} / ${total}`;
      const pctScore = Math.round((score / total) * 100);
      let msg = '';
      if (pctScore >= 90) msg = '🏆 ¡Excelente! Dominas estos tiempos verbales.';
      else if (pctScore >= 70) msg = '👍 ¡Muy bien! Solo unos detalles por pulir.';
      else if (pctScore >= 50) msg = '📚 Buen intento. Repasa since/for y los tiempos.';
      else msg = '💪 ¡Sigue practicando! Vuelve a intentarlo.';
      document.getElementById('finalPct').textContent = `${pctScore}% · ${msg}`;

      const failedCount = getFailedQuestions().length;
      const failedInfo = document.getElementById('failedInfo');
      if (failedCount > 0) {
        failedInfo.style.display = 'block';
        failedInfo.textContent = `📌 Tienes ${failedCount} pregunta(s) fallada(s) guardada(s) para repasar.`;
        document.getElementById('reviewBtn2').style.display = 'inline-block';
      } else {
        failedInfo.style.display = 'none';
        document.getElementById('reviewBtn2').style.display = 'none';
      }

      document.getElementById('scoreBox').style.display = 'block';
      document.getElementById('scoreBox').scrollIntoView({ behavior: 'smooth' });
      updateFailedCount();
    }, 400);
  }
}

// ============================================================
// INICIALIZACIÓN
// ============================================================
(function init() {
  updateFailedCount();
  selectRandomQuestions();
  renderQuestions();
})();
</script>
</body>
</html>
