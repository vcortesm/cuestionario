    // Asegurar que tengamos exactamente 100 preguntas (si alguna se repite por error, pero son únicas)
    console.log("Total preguntas cargadas:", bank.length);

    let shuffledIndices = [];

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function clearAllFeedbacks() {
        document.querySelectorAll('.feedback').forEach(fb => fb.remove());
    }

    function renderQuestions() {
        shuffledIndices = [...Array(bank.length).keys()];
        shuffleArray(shuffledIndices);
        const container = document.getElementById('questions-container');
        container.innerHTML = '';
        
        shuffledIndices.forEach((origIdx, pos) => {
            const q = bank[origIdx];
            const qDiv = document.createElement('div');
            qDiv.className = 'question-card';
            qDiv.setAttribute('data-original-idx', origIdx);
            
            const qTextSpan = document.createElement('div');
            qTextSpan.className = 'question-text';
            qTextSpan.innerText = `${pos+1}. ${q.text}`;
            qDiv.appendChild(qTextSpan);
            
            const optsDiv = document.createElement('div');
            optsDiv.className = 'options';
            const radioName = `q_${pos}`;
            q.options.forEach((opt, optIdx) => {
                const label = document.createElement('label');
                label.className = 'option';
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = radioName;
                radio.value = optIdx;
                label.appendChild(radio);
                label.appendChild(document.createTextNode(` ${opt}`));
                optsDiv.appendChild(label);
            });
            qDiv.appendChild(optsDiv);
            
            const refSpan = document.createElement('div');
            refSpan.className = 'ref';
            refSpan.innerHTML = `📄 Fuente: ${q.page}`;
            qDiv.appendChild(refSpan);
            container.appendChild(qDiv);
        });
        clearAllFeedbacks();
    }

    function evaluateAndShow() {
        clearAllFeedbacks();
        let totalCorrect = 0;
        const total = shuffledIndices.length;
        const cards = document.querySelectorAll('.question-card');
        
        for (let i = 0; i < total; i++) {
            const radios = document.getElementsByName(`q_${i}`);
            let selectedVal = null;
            for (let r of radios) if (r.checked) { selectedVal = parseInt(r.value); break; }
            const originalIdx = shuffledIndices[i];
            const correctIdx = bank[originalIdx].correct;
            const isCorrect = (selectedVal !== null && selectedVal === correctIdx);
            if (isCorrect) totalCorrect++;
            
            const card = cards[i];
            const feedbackDiv = document.createElement('div');
            feedbackDiv.className = 'feedback';
            let userAnswerText = "No respondida";
            if (selectedVal !== null) userAnswerText = bank[originalIdx].options[selectedVal];
            const correctAnswerText = bank[originalIdx].options[correctIdx];
            
            if (isCorrect) {
                feedbackDiv.classList.add('feedback-correct');
                feedbackDiv.innerHTML = `✅ Correcta — Tu respuesta: "${userAnswerText}"`;
            } else {
                feedbackDiv.classList.add('feedback-wrong');
                feedbackDiv.innerHTML = `❌ Incorrecta<br>📌 Tu respuesta: "${userAnswerText}"<br>✔️ Respuesta correcta: "${correctAnswerText}"`;
            }
            card.appendChild(feedbackDiv);
        }
        
        const percent = (totalCorrect / total) * 100;
        const resultDiv = document.getElementById('resultPanel');
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `📊 Resultado final: ${totalCorrect} de ${total} correctas.<br>🎯 Porcentaje: <span class="score-highlight">${percent.toFixed(1)}%</span>`;
        resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
    
    function resetSelectionsOnly() {
        for (let i = 0; i < shuffledIndices.length; i++) {
            document.getElementsByName(`q_${i}`).forEach(r => r.checked = false);
        }
        clearAllFeedbacks();
        const resultDiv = document.getElementById('resultPanel');
        resultDiv.style.display = 'none';
        resultDiv.innerHTML = '';
    }
    
    function reshuffleAndClean() {
        renderQuestions();
        resetSelectionsOnly();
    }
    
    document.addEventListener('DOMContentLoaded', () => {
        renderQuestions();
        document.getElementById('checkBtn').addEventListener('click', evaluateAndShow);
        document.getElementById('resetBtn').addEventListener('click', resetSelectionsOnly);
        document.getElementById('reshuffleBtn').addEventListener('click', reshuffleAndClean);
    });
</script>
