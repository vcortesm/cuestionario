<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>📘 Contraguerilla · preguntas trampa</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #d9e0eb;

            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .quiz-wrapper {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 36px;
            box-shadow: 0 20px 40px rgba(0, 15, 30, 0.25);
            padding: 20px 18px;
            margin: 5px 0 20px;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #0b2a41;
            border-left: 8px solid #b22222;
            padding-left: 16px;
            margin: 0 0 8px 0;
            line-height: 1.2;
        }
        .header-desc {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }
        .badge {
            background: #dee7f2;
            border-radius: 40px;
            padding: 6px 18px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #1c3f5c;
        }
        .pregunta {
            background: #f7fafd;
            border-radius: 28px;
            padding: 18px 16px;
            margin-bottom: 22px;
            border: 2px solid transparent;
            transition: 0.15s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.03);
        }
        .pregunta.correcta { background: #e2f3e2; border-color: #1e7e34; }
        .pregunta.incorrecta { background: #ffe9e7; border-color: #b53b3b; }

        .encabezado {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 10px 8px;
            margin-bottom: 15px;
        }
        .num-preg {
            background: #102b47;
            color: white;
            border-radius: 60px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            flex-shrink: 0;
        }
        .enunciado {
            font-weight: 650;
            font-size: 1.1rem;
            line-height: 1.4;
            color: #04233e;
            flex: 1;
        }
        .pagina-ref {
            background: #cfdcf0;
            padding: 5px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #102b47;
            white-space: nowrap;
        }
        .opciones { display: flex; flex-direction: column; gap: 12px; margin: 12px 0 5px; }
        .opcion {
            background: white;
            border-radius: 50px;
            padding: 14px 20px;
            border: 1px solid #b6cae5;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            font-size: 1rem;
            line-height: 1.3;
            word-break: break-word;
        }
        .opcion:hover { background: #e3edfe; }
        input[type="radio"] { width: 20px; height: 20px; flex-shrink: 0; accent-color: #1e3e6e; }

        .completar-input {
            width: 100%;
            border-radius: 60px;
            border: 1px solid #9bb1d3;
            padding: 16px 22px;
            font-size: 1.05rem;
            background: white;
            margin: 8px 0 5px;
        }

        /* orden */
        .orden-container { background: #eef4fc; border-radius: 30px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .orden-item {
            background: white; border-radius: 60px; padding: 12px 18px;
            display: flex; align-items: center; gap: 12px; border: 1px solid #a0b7d9;
            flex-wrap: wrap;
        }
        .orden-texto { font-weight: 500; flex: 1; font-size: 1rem; }
        .orden-select { padding: 8px 12px; border-radius: 40px; border: 1px solid #1d3f6e; font-weight: 600; width: 75px; font-size: 1rem; background: white; }

        /* columnas */
        .columnas-flex { display: flex; flex-direction: column; gap: 20px; margin: 10px 0; }
        .col-izq, .col-der { width: 100%; }
        .item-col {
            background: white; border-radius: 60px; padding: 12px 18px; margin-bottom: 10px;
            border: 1px solid #8ea5cf; display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 8px;
        }
        .col-select { padding: 8px 8px; border-radius: 30px; border: 1px solid #1e3b5e; width: 140px; background: white; font-size: 0.9rem; max-width: 45%; }

        .feedback {
            font-size: 0.98rem;
            margin-top: 16px;
            padding: 12px 16px;
            background: #edf3fd;
            border-radius: 30px;
            border-left: 5px solid #2f4b78;
            word-break: break-word;
        }
        .botonera {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 30px 0 20px;
        }
        button {
            background: #0a2942;
            border: none;
            color: white;
            font-size: 1.3rem;
            font-weight: 700;
            padding: 18px 20px;
            border-radius: 60px;
            box-shadow: 0 6px 0 #03121f;
            cursor: pointer;
            transition: 0.1s;
            width: 100%;
            letter-spacing: 0.3px;
            border: 1px solid #ffffff30;
        }
        button.reset { background: #4f3d2b; box-shadow: 0 6px 0 #2e231b; }
        button:active { transform: translateY(4px); box-shadow: 0 2px 0 #03121f; }

        .resultado-global {
            background: #dae6fb;
            border-radius: 50px;
            padding: 22px 18px;
            text-align: center;
            font-size: 1.9rem;
            font-weight: 700;
            color: #002856;
            border: 2px solid #002856;
            line-height: 1.2;
        }
        footer { text-align: center; color: #48658b; margin-top: 25px; font-size: 0.9rem; }
        .nota-pie { background: #fcf2dd; border-radius: 40px; padding: 12px; margin: 15px 0 5px; text-align: center; font-size: 0.95rem; }
    </style>
</head>

        <span class="badge">📱 58 preguntas únicas</span>
        <span class="badge">📄 p.166–186</span>

    <div class="botonera">
        <button id="calificarBtn">✅ CALIFICAR</button>
        <button id="reiniciarBtn" class="reset">⟲ REINICIAR (nuevo orden)</button>
    </div>
    <div id="resultado" class="resultado-global">🔍 0 / 58</div>

</div>

    addRaw('mc', 'Tácticas enemigas (431-F):', 171,
        ['cortas, sorpresivas, rápidas, violentas',    // correcta
         'breves, inesperadas, veloces, agresivas',    // trampa: sinónimos

         'fulminantes y repentinas'], 0);               // trampa: abreviado

    addRaw('mc', 'La contraguerilla debe conocer perfectamente según 461:', 184,
        ['el terreno',                                  // correcta

    addRaw('mc', 'Cualidades del combatiente (462):', 184,

        [['Unidades especiales', 'alto adiestramiento'], ['Fuerzas aisladas', 'armamento capturado'], ['Grupos traidores', 'asesorados por invasor'], ['Fuerzas blindadas', 'causar desorganización']]);
    addRaw('columna', 'Relacione fase con acción:', 176, null, null, null, null,
        [['Preparación', 'organizar comités'], ['Declaratoria', 'anunciar sanciones'], ['Ejecutoria', 'aplicar medidas']]);
    addRaw('columna', 'Vulnerabilidades guerrilla (424):', 168, null, null, null, null,
        [['apoyo externo', 'interdicción'], ['captura equipos', 'prevenir'], ['apoyo población', 'reducir con opsicol']]);

    // ----------------------------------------------------
    // Construcción con mezcla real (opciones reordenadas)
    // ----------------------------------------------------
    let preguntas = [];

    function buildShuffled() {
        preguntas = [];
        rawPreguntas.forEach(raw => {
            if (raw.tipo === 'mc') {
                let opts = [...raw.opcionesRaw];
                let correctVal = opts[raw.correctaRaw];
                for (let i = opts.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [opts[i], opts[j]] = [opts[j], opts[i]];
                }
                let newIdx = opts.indexOf(correctVal);
                preguntas.push({
                    id: preguntas.length,
                    tipo: raw.tipo,
                    enunciado: raw.enunciado,
                    pagina: raw.pagina,
                    opciones: opts,
                    correctaIdx: newIdx,
                });
            } else if (raw.tipo === 'completar') {
                preguntas.push({
                    id: preguntas.length,
                    tipo: raw.tipo,
                    enunciado: raw.enunciado,
                    pagina: raw.pagina,
                    textoCompletar: raw.textoCompletar,
                });
            } else if (raw.tipo === 'orden') {
                let mezclado = shuffleArr(raw.ordenItems);
                preguntas.push({
                    id: preguntas.length,
                    tipo: raw.tipo,
                    enunciado: raw.enunciado,
                    pagina: raw.pagina,
                    ordenItems: mezclado,
                    correctOrder: raw.correctOrder,
                });
            } else if (raw.tipo === 'columna') {
                preguntas.push({
                    id: preguntas.length,
                    tipo: raw.tipo,
                    enunciado: raw.enunciado,
                    pagina: raw.pagina,
                    parejas: raw.parejas,
                });
            }
        });
    }
    buildShuffled();

    // ========== RENDER ==========
    const container = document.getElementById('preguntas');
    function renderQuiz() {
        let html = '';
        preguntas.forEach((p, idx) => {
            html += `<div class="pregunta" id="preg-${idx}" data-tipo="${p.tipo}">`;
            html += `<div class="encabezado"><span class="num-preg">${idx+1}</span><span class="enunciado">${p.enunciado}</span><span class="pagina-ref">p.${p.pagina}</span></div>`;

            if (p.tipo === 'mc') {
                html += `<div class="opciones" id="input-${idx}">`;
                p.opciones.forEach((opt, optIdx) => {
                    html += `<label class="opcion"><input type="radio" name="preg_${idx}" value="${optIdx}"> ${opt}</label>`;
                });
                html += `</div>`;
            } else if (p.tipo === 'completar') {
                html += `<input class="completar-input" type="text" id="input-${idx}" placeholder="respuesta exacta">`;
            } else if (p.tipo === 'orden') {
                html += `<div class="orden-container" id="input-${idx}">`;
                p.ordenItems.forEach((item, pos) => {
                    html += `<div class="orden-item"><span class="orden-texto">🔹 ${item}</span> <select class="orden-select" data-preg="${idx}" data-pos="${pos}">`;
                    for (let i=0; i<p.ordenItems.length; i++) html += `<option value="${i}">${i+1}</option>`;
                    html += `</select></div>`;
                });
                html += `</div>`;
            } else if (p.tipo === 'columna') {
                html += `<div class="columnas-flex" id="input-${idx}"><div class="col-izq">`;
                p.parejas.forEach((par, pairIdx) => {
                    html += `<div class="item-col"><span>${par[0]}</span> <select class="col-select" data-preg="${idx}" data-pair="${pairIdx}"><option value="">—elige—</option>`;
                    p.parejas.forEach(opt => html += `<option value="${opt[1]}">${opt[1]}</option>`);
                    html += `</select></div>`;
                });
                html += `</div></div>`;
            }
            html += `<div class="feedback" id="fb-${idx}"></div>`;
            html += `</div>`;
        });
        container.innerHTML = html;
    }
    renderQuiz();

    // ========== CALIFICAR ==========
    document.getElementById('calificarBtn').addEventListener('click', function() {
        let aciertos = 0;
        preguntas.forEach((p, idx) => {
            const fb = document.getElementById(`fb-${idx}`);
            const divP = document.getElementById(`preg-${idx}`);
            let correcta = false;
            let msg = '';

            if (p.tipo === 'mc') {
                const radios = document.getElementsByName(`preg_${idx}`);
                let sel = null;
                for (let r of radios) if (r.checked) { sel = r.value; break; }
                if (sel !== null && parseInt(sel) === p.correctaIdx) correcta = true;
                if (!correcta) msg = `❌ Correcta: "${p.opciones[p.correctaIdx]}" (op ${p.correctaIdx+1})`;
            } else if (p.tipo === 'completar') {
                const inp = document.getElementById(`input-${idx}`);
                if (inp && inp.value.trim().toLowerCase() === p.textoCompletar.toLowerCase()) correcta = true;
                if (!correcta) msg = `❌ Respuesta: "${p.textoCompletar}"`;
            } else if (p.tipo === 'orden') {
                const selects = document.querySelectorAll(`#input-${idx} .orden-select`);
                let user = []; selects.forEach(s => user.push(parseInt(s.value)));
                if (user.join() === [0,1,2,3].slice(0,p.ordenItems.length).join()) correcta = true;
                if (!correcta) msg = `❌ Orden correcto: ${p.correctOrder.join(' → ')}`;
            } else if (p.tipo === 'columna') {
                const selects = document.querySelectorAll(`#input-${idx} .col-select`);
                let ok = true;
                selects.forEach((s, i) => { if (s.value !== p.parejas[i][1]) ok = false; });
                if (ok) correcta = true;
                if (!correcta) msg = `❌ Combinaciones: ${p.parejas.map(par=>`${par[0]} → ${par[1]}`).join('; ')}`;
            }

            if (correcta) { divP.classList.add('correcta'); divP.classList.remove('incorrecta'); fb.innerHTML = '✅ Correcto'; aciertos++; }
            else { divP.classList.add('incorrecta'); divP.classList.remove('correcta'); fb.innerHTML = msg || '❌ Incorrecto'; }
        });
        document.getElementById('resultado').innerText = `🎯 ${aciertos} / ${preguntas.length}`;
    });

    document.getElementById('reiniciarBtn').addEventListener('click', function() {
        buildShuffled();
        renderQuiz();
        document.getElementById('resultado').innerText = `🔍 0 / ${preguntas.length}`;
    });
})();
</script>
</body>
</html>
